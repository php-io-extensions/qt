name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux cells run in an image with PHP and Qt preinstalled (.github/ci/Dockerfile), so they
    # download nothing from an Ubuntu mirror. An empty image runs the cell on the host (macOS).
    container: ${{ matrix.os == 'ubuntu-24.04' && format('usftechacg/php-qt:{0}-{1}', matrix.php, matrix.ts) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP (macOS)
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt pkgconf vulkan-headers

      - name: Build
        run: |
          phpize
          ./configure --enable-qt
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/qt.so" -r 'exit(extension_loaded("qt") ? 0 : 1);'
          php -n -d extension="$PWD/modules/qt.so" --ri qt
